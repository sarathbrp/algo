# ---------------------------------------------------------------------------
# 2) Strategy (trend-following; see README for behavior — must match code in src/strategy.py)
# ---------------------------------------------------------------------------
strategy:
  type: trend_following   # trend_following | mean_reversion | breakout
  # player_focus retail: MAs from strategy.retail + shorter time exit. institutional: adds volume filter on entry.
  player_focus: retail   # retail | neutral | institutional
  # Institutional: only trade when volume >= N x 20d avg (proxy for institutional activity)
  institutional:
    min_volume_ratio_vs_avg: 1.2   # e.g. 1.2 = 20% above average volume
  # Retail: overrides MA periods; time_bars_exit here overrides strategy.exits.time_bars_exit in code (see strategy.py).
  retail:
    ma_fast: 10
    ma_slow: 50
    time_bars_exit: 10   # live loop: compared to calendar days since entry (positions_tracked), not bar count
  # Candlestick filter: only enter when one of these patterns appears (uses same OHLC)
  candlestick_filter:
    enabled: false
    patterns: [ "bullish_engulfing", "hammer" ]   # or "doji"; leave empty to allow any
  trend_following:
    # Retail / more entries: 10/50 MAs, momentum, allow noisier names
    entry_mode: momentum
    ma_fast: 10
    ma_slow: 50
    pullback_touch_ma_fast: true
    pullback_tolerance_pct: 2.0   # used only when entry_mode: pullback
    volatility_filter_atr_period: 14
    max_atr_pct_for_entry: 4.0   # allow noisier names for proof-of-life
  exits:
    stop_loss_pct: 1.5
    # Wall-clock minimum before partial, trail, time exit, kill-switch, or news-based exit (live).
    # Stop-loss always allowed. Daily backtest uses ~bars_held × 1440 min when wall clock not passed.
    min_hold_minutes: 1440   # 1 day
    cooldown_after_stop_minutes: 30 # avoid immediate re-entry after stop loss
    require_new_breakout_after_stop: true  # re-entry only after price breaks above stopped level
    cooldown_after_profit_minutes: 10  # avoid immediate re-entry after profit booking
    require_price_above_exit_after_profit: true  # re-entry only when price > previous exit price
    take_profit_pct: null           # no fixed full exit; use partial + trailing
    use_trailing_stop: true
    trailing_stop_pct: 3.0          # trail remainder by this % below high
    partial_take_profit_pct: 3.0    # take partial at this % gain
    partial_exit_ratio: 0.5         # sell this fraction (e.g. 0.5 = 50%) at partial target
    time_bars_exit: 25              # exit after 25 bars (20-30 range)
    kill_switch:
      max_spread_pct: 0.7
      max_atr_pct: 3.0   # exit if ATR% > this (was max_atr_multiple; same scale: percent)

# ---------------------------------------------------------------------------
# 3) Position Sizing
# ---------------------------------------------------------------------------
position_sizing:
  risk_per_trade_pct: 0.25     # 0.25 - 1.0 of equity at risk per trade
  max_open_risk_pct: 3.0       # sum of stop distances cap (2-5%)
  # Per position: min(% of equity, dollar cap) — alias intent: max_position_pct_equity / max_position_dollar_cap
  max_exposure_per_symbol_pct: 10.0   # max % of account in any single position (~10–12 typical)
  max_position_dollar_cap: 2000       # hard USD cap per new position (null = no cap)
  max_exposure_per_sector_pct: 25.0
  # Position sizing reduction during high volatility regimes
  high_vol_reduction:
    enabled: true
    atr_pct_threshold: 2.0     # when ATR% (14d) > this, reduce size
    size_multiplier: 0.5       # multiply shares by this (e.g. half size)

# ---------------------------------------------------------------------------
# 4) Portfolio & Drawdown
# ---------------------------------------------------------------------------
portfolio_risk:
  daily_loss_limit_pct: -2.0
  max_drawdown_pct: -10.0
  safe_mode_after_max_dd: true
  recovery_criteria_pct: -8.0   # resume live after drawdown recovers to this
  max_trades_per_day: 15
  max_trades_per_symbol_per_day: 3

# ---------------------------------------------------------------------------
# 4b) Market regime score (adjust position size by regime)
# ---------------------------------------------------------------------------
# Score 0–5: SPY>MA50, QQQ>MA50, VIXY<threshold, HYG rising, TLT falling.
# 4–5 bullish, 2–3 neutral, 0–1 defensive. Bot detects regime first, then trades sector + targets.
market_regime:
  enabled: true
  symbols:   # Market Regime group (detect only; not in trade universe)
    spy: SPY
    qqq: QQQ
    vix: VIXY       # volatility proxy; raise vix_threshold if using VIXY (e.g. 25)
    hyg: HYG
    tlt: TLT
  ma_period_trend: 50           # for SPY/QQQ above MA
  ma_period_rising_falling: 20  # for HYG rising / TLT falling
  vix_threshold: 20
  size_multipliers:
    bullish: 1.0    # full size when score 4–5
    neutral: 0.8     # reduce when score 2–3
    defensive: 0.5   # half size when score 0–1

# ---------------------------------------------------------------------------
# 4c) Options (v1 — long premium; loop uses Alpaca chain + these caps)
# ---------------------------------------------------------------------------
# Long premium only: buy calls/puts; no short premium / no selling uncovered.
options:
  enabled: true
  mode: long_premium_only   # calls/puts only, no selling
  # Premium = mid × contracts × 100 (debit), not stock notional — see src/options_premium_risk.py
  max_total_options_exposure_pct: 5   # cap: sum(open long options |cost_basis|) + new premium ≤ this % of equity
  max_option_position_pct: 2         # per order: premium budget = min(this % equity, room left under total cap)
  max_open_option_positions: 1
  # v1: contracts = floor(budget / (mid×100)); if 0 → skip "premium too expensive"; then cap at this many
  v1_max_contracts_per_trade: 1       # bullish → up to N ATM calls; bearish → up to N ATM puts

  allowed_underlyings:
    - SPY
    - QQQ
    - NVDA

  contract_selection:
    expiry_min_days: 14
    expiry_max_days: 35
    moneyness: ATM          # ATM only for v1
    max_bid_ask_spread_pct: 5.0
    min_open_interest: 500
    min_volume: 100

  entry_mapping:
    bullish_signal: call
    bearish_signal: put

  exits:
    profit_take_pct: 40
    stop_loss_pct: 30
    max_hold_days: 5
    exit_if_underlying_breaks_signal: true

  compliance:
    block_if_pdt_risk: true
    use_cash_account_safe_mode: true

# ---------------------------------------------------------------------------
# 5) Execution
# ---------------------------------------------------------------------------
execution:
  prefer_limit_orders: true
  limit_order_offset_ticks: 1
  max_spread_pct_to_trade: 1.0   # must be >= widest tier; 0.10% blocks almost everything on IEX
  partial_fill_timeout_seconds: 30
  cancel_replace_on_partial: true
  max_slippage_bps: 10
  block_strategy_if_slippage_bps_avg_exceeds: 25

# ---------------------------------------------------------------------------
# 7) Broker (Alpaca)
# ---------------------------------------------------------------------------
broker:
  firm: alpaca
  # paper: true  = paper trading (no real money).  paper: false  = LIVE (real money).
  # Override without editing file: APCA_PAPER=false or ALPACA_LIVE=true for live; APCA_PAPER=true for paper.
  paper: true
  # Run continuously until market close (no user interaction):
  #   python run_alpaca_loop.py
  run_until_close: false
  # Check intervals — paper vs live (worker auto-selects based on account mode)
  # Paper: 2 min exits, 5 min entries (fast enough for testing, light on API)
  # Live:  1 min exits, 2 min entries (real money needs fast reaction)
  exit_check_interval_minutes: 2
  entry_check_interval_minutes: 5
  live_exit_check_interval_minutes: 1
  live_entry_check_interval_minutes: 2
  # Retry on API connection drops (e.g. "Remote end closed connection")
  # api_retry_times: 3
  # api_retry_delay_sec: 3.0
  # data_feed: iex   # free. Use "sip" only if you have a paid data subscription.
  # options_feed: indicative   # Alpaca option chain: "indicative" (default) or "opra" (paid subscription)
  # API keys from environment (never put real keys in this file):
  #   Paper: APCA_API_KEY_ID, APCA_API_SECRET_KEY  (from Alpaca Paper Trading → API Keys)
  #   Live:  ALPACA_LIVE_API_KEY_ID, ALPACA_LIVE_API_SECRET_KEY  (from Alpaca Live → API Keys; Alpaca uses separate keys for live)
  #   Or set APCA_* to live keys when running --live (then use paper keys only when running --paper).
  # Paper base URL: https://paper-api.alpaca.markets   Live: https://api.alpaca.markets

# ---------------------------------------------------------------------------
# 6) Compliance (PDT, etc.)
# ---------------------------------------------------------------------------
compliance:
  pdt_min_equity: 25000
  pdt_enabled: true
  margin_account: true
  day_trade_count_reset_calendar: "rolling_5_business_days"
  best_execution_note: "Broker has best execution duty; app enforces limits only."
