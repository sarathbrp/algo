# Algorithmic Trading App - Default Configuration
# Override via environment or config file per environment.

# ---------------------------------------------------------------------------
# 1) Universe & Data
# ---------------------------------------------------------------------------
# Traded symbols = universe.symbols minus universe.paused_symbols.
# Inverse ETFs (SQQQ/SPXS) are configured under universe.bear_etfs only (not counted in regime % unless listed in symbols).
# Core universe below: index/sector ETFs + mega-cap tech + China ADRs.
universe:
  symbols:
    # Index / breadth
    - SPY
    - QQQ
    - IWM
    # Sector / thematic ETFs
    - XLF
    - XLK
    - XLE
    - GLD
    # Mega-cap tech
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - META
    - GOOGL
    - AMD
    - TSLA
    # China ADRs
    - BABA
    - JD
    - PDD
  paused_symbols: []   # add tickers here to exclude from scan/trade
  # Regime filter: when < 30% above 50D MA = bearish → skip long entries; bear ETFs if breakdown
  regime_min_pct_above_50d_ma: 0.30
  # Inverse ETFs: max_positions = max distinct bear tickers held; total notional cap (max_exposure_pct_equity).
  bear_etfs:
    symbols:
      - SQQQ
      - SPXS

    breakdown:
      reference_symbol: QQQ
      ma_period: 50

    prefer_sqqq_when_breakdown_reference_is_qqq: true

    max_positions: 3
    max_exposure_pct_equity: 30
    stop_pct: 2.0

    controlled_scaling:
      enabled: true
      symbol: SQQQ
      reference_symbol: QQQ
      ma_period: 50
      cooldown_minutes: 10

      steps:
        - reference_ma_distance_pct_min: 1.0
          size_multiplier: 0.40
        - reference_ma_distance_pct_min: 2.5
          size_multiplier: 0.30
        - reference_ma_distance_pct_min: 4.0
          size_multiplier: 0.30

      require_price_above_last_entry: true

    # Legacy YAML only — run_alpaca_loop does not read this (use controlled_scaling).
    sqqq_add_on_strong_trend:
      enabled: false
      reference_ma_distance_pct_min: 1.5
      size_multiplier: 0.35
  # Bearish regime: by default no new trend longs. Optionally allow some, capped:
  bearish_allow_trend_long_entries: false   # true = still run entry scan when bearish (subject to max below)
  bearish_max_normal_long_positions: null    # e.g. 4 — max non-inverse long positions when bearish (null = no cap)
  # Minimum liquidity / volume filters
  min_avg_dollar_volume_30d: 50_000_000
  min_atr_multiple_for_volume: 0.5   # min volume vs ATR-based expectation

# NewsAPI → FinBERT (optional). Default off; live loop forces OFF when using --live (see run_alpaca_loop).
news_sentiment:
  enabled: false
  newsapi_key_env: NEWSAPI_KEY
  headline_lookback_hours: 24
  max_headlines: 15
  cache_ttl_seconds: 900
  finbert_model: ProsusAI/finbert
  positive_score_threshold: 0.12   # FinBERT score ~[-1,1]: buy if >= this AND volume spike
  negative_score_threshold: -0.12  # sell if <= this AND weak trend (close < MA)
  volume_spike_min: 1.5            # last-day volume / avg prior N days
  volume_lookback_days: 20
  weak_trend_ma_period: 20

market_sessions:
  pre_market:
    start: "04:00"   # ET
    end: "09:30"
    trade_allowed: false   # thin liquidity
  regular:
    start: "09:30"
    end: "16:00"
    trade_allowed: true
  after_hours:
    start: "16:00"
    end: "20:00"
    trade_allowed: false   # wider spreads

market_quality:
  # Spread gate: filter stale quotes; thresholds 0.5% core / 0.5% high-vol (unblocks symbols with valid quotes)
  max_spread_pct: 0.5     # core liquid: allow up to 0.5%
  high_vol_max_spread_pct: 0.5   # high-vol: allow up to 0.5%
  stale_quote_max_age_seconds: 60   # quotes older than this are filtered (use default spread for gate)
  min_volume_atr_ratio: 1.0
  block_on_news_spike: true
  news_volatility_spike_atr_pct: 8.0   # block only when ATR% >= this (volatility spike)
  # High-vol bucket (same spread threshold; list for DNT/other logic)
  high_vol_symbols:
    - COIN
    - RIVN
    - SOFI
    - UPST
    - MARA
    - SMCI
    - SNOW
    - FXI
    - KWEB
    - BABA
    - JD
    - PDD
# (high_vol_max_spread_pct set above with core)

# US market holidays / half-days (sample; extend per year)
holidays: []   # populated at runtime or from calendar

# ---------------------------------------------------------------------------
# 1b) Trade filters: macro blackout, earnings blackout, volatility DNT
# ---------------------------------------------------------------------------
trade_filters:
  # Macro-event blackout: no trading on these dates or time windows (ET)
  macro_blackout:
    enabled: true
    # Full-day blackout (no trading all day)
    blackout_dates: []   # e.g. ["2025-03-12", "2025-04-10"]  FOMC, CPI, etc.
    # Or specific time windows on a date (start/end in ET, "HH:MM")
    blackout_windows: []  # e.g. [{ date: "2025-03-12", start: "13:00", end: "15:30" }]

  # Earnings blackout per symbol: no trading N days before/after earnings
  earnings_blackout:
    enabled: true
    days_before: 1
    days_after: 1
    # Earnings dates per symbol (YYYY-MM-DD). Update manually or from calendar.
    earnings_dates:
