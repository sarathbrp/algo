services:
  tidb:
    image: pingcap/tidb:latest
    ports:
      - "${TIDB_PORT:-4000}:4000"
    volumes:
      - tidb-data:/tmp/tidb
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:10080/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - TIDB_DSN=mysql+pymysql://root:@tidb:4000/algosphere
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - API_PORT=8000
      - APCA_API_KEY_ID=${APCA_API_KEY_ID:-}
      - APCA_API_SECRET_KEY=${APCA_API_SECRET_KEY:-}
      - ALPACA_LIVE_API_KEY_ID=${ALPACA_LIVE_API_KEY_ID:-}
      - ALPACA_LIVE_API_SECRET_KEY=${ALPACA_LIVE_API_SECRET_KEY:-}
    depends_on:
      tidb:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/worker-entrypoint.sh"]
    command: ["--paper"]
    environment:
      - TIDB_DSN=mysql+pymysql://root:@tidb:4000/algosphere
      - REDIS_URL=redis://redis:6379/0
      - APCA_API_KEY_ID=${APCA_API_KEY_ID:-}
      - APCA_API_SECRET_KEY=${APCA_API_SECRET_KEY:-}
      - ALPACA_LIVE_API_KEY_ID=${ALPACA_LIVE_API_KEY_ID:-}
      - ALPACA_LIVE_API_SECRET_KEY=${ALPACA_LIVE_API_SECRET_KEY:-}
    depends_on:
      tidb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  tidb-data:
